<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Curb sandbox</title>
<style>
  html,body{margin:0;padding:0;font:16px/1.5 system-ui,sans-serif;color:#111;background:#fff}
  #curb-root{padding:16px}
</style>
</head>
<body>
<div id="curb-root"></div>
<script>
  window.__CURB_FRAME_ID__ = new URLSearchParams(location.search).get('i') || '?';
  parent.postMessage({__probe:1,i:window.__CURB_FRAME_ID__,stage:'inline-ran'},'*');
  window.addEventListener('error',function(ev){
    parent.postMessage({__probe:1,i:window.__CURB_FRAME_ID__,stage:'error',msg:String(ev.message||''),src:String((ev.target&&ev.target.src)||'')},'*');
  },true);
</script>
<script src="./runtime.js"
  onload="parent.postMessage({__probe:1,i:window.__CURB_FRAME_ID__,stage:'script-onload'},'*')"
  onerror="parent.postMessage({__probe:1,i:window.__CURB_FRAME_ID__,stage:'script-onerror'},'*')"></script>
</body>
</html>
